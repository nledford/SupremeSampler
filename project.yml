name: SupremeSampler

options:
  bundleIdPrefix: com.nateledford
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic

targets:
  SupremeSampler:
    type: application
    platform: macOS
    sources:
      - path: Sources/SupremeSampler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nateledford.SupremeSampler
        PRODUCT_NAME: SupremeSampler
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES

  SupremeSamplerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SupremeSamplerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SupremeSampler

schemes:
  SupremeSampler:
    build:
      targets:
        SupremeSampler: all
        SupremeSamplerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SupremeSamplerTests
