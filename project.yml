name: SupremeSampler

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1

options:
  bundleIdPrefix: com.nateledford
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic

targets:
  SupremeSampler:
    type: application
    platform: macOS
    sources:
      - path: Sources/SupremeSampler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nateledford.SupremeSampler
        # The app's name as people see it: Xcode derives the bundle's file
        # name, CFBundleName (the app-menu title) and the executable from
        # it. The module keeps the space-free name code imports.
        PRODUCT_NAME: Supreme Sampler
        PRODUCT_MODULE_NAME: SupremeSampler
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: GRDB
        product: GRDB

  SupremeSamplerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SupremeSamplerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen builds this from the target name, not PRODUCT_NAME.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Supreme Sampler.app/Contents/MacOS/Supreme Sampler"
    dependencies:
      - target: SupremeSampler
      - package: GRDB
        product: GRDB

schemes:
  SupremeSampler:
    build:
      targets:
        SupremeSampler: all
        SupremeSamplerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SupremeSamplerTests
