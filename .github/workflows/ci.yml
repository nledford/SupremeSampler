name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-macos-build
      - name: Run the release-version shell tests
        run: bash scripts/tests/release-version-test.sh
      - name: Run the test suite
        run: just test

  build:
    uses: ./.github/workflows/build-app.yml
